name: ScoreForge checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: scoreforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npm run release:check
      - run: npm test
        env:
          SF_SKIP_BROWSER: '1'
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local server
        env:
          SF_HEADERS: '1'
        run: |
          npm run serve > /tmp/scoreforge-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scoreforge-server.log
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-results
          path: output/playwright/
          if-no-files-found: ignore
